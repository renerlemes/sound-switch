name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Componentes
        uses: actions/checkout@v5
        with:
          repository: renerlemes/components-react
          path: vendor/components-react

      - name: Link dos componentes
        shell: pwsh
        run: |
          $dest = Join-Path (Resolve-Path (Join-Path $PWD '..\..\..')).Path 'Componentes\components-react'
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Copy-Item -Recurse (Join-Path $PWD 'vendor\components-react') $dest

      - name: Versão
        id: version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Processo auxiliar
        shell: pwsh
        run: |
          dotnet publish native/SoundSwitch.Audio/SoundSwitch.Audio.csproj -c Release -r win-x64 -o native/dist
          if ($LASTEXITCODE -ne 0) {
            dotnet publish native/SoundSwitch.Audio/SoundSwitch.Audio.csproj -c Release -r win-x64 -o native/dist -p:PublishAot=false --self-contained true -p:PublishTrimmed=true
          }
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed with exit code $LASTEXITCODE." }

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Instalador
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm build
          if ($LASTEXITCODE -ne 0) { throw "pnpm build failed with exit code $LASTEXITCODE." }
          pnpm exec electron-builder --win --publish never --config electron-builder.yml -c.extraMetadata.version=${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed with exit code $LASTEXITCODE." }

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $setup = Join-Path release "SoundSwitch_${version}_Setup.exe"
          $blockmap = "$setup.blockmap"
          $latest = Join-Path release 'latest.yml'
          foreach ($file in @($setup, $blockmap, $latest)) {
            if (-not (Test-Path $file)) { throw "Arquivo de publicação ausente: $file" }
          }
          gh release create $tag $setup $blockmap $latest `
            --repo '${{ github.repository }}' `
            --title "SoundSwitch $version" `
            --generate-notes
